# TailwindCSS Template Card - Example Configurations

# =============================================================================
# BASIC EXAMPLES
# =============================================================================

# Simple Temperature Display
basic_temperature:
  type: custom:tailwindcss-template-card
  content: |
    <div class="p-4 bg-white dark:bg-slate-800 rounded-xl">
      <p class="text-gray-500 text-sm">Temperature</p>
      <p class="text-3xl font-bold text-gray-900 dark:text-white">
        {{ states('sensor.temperature') }}°C
      </p>
    </div>

# Entity State Badge
basic_badge:
  type: custom:tailwindcss-template-badge
  entity: binary_sensor.front_door
  content: |
    <span class="flex items-center gap-2">
      <ha-icon icon="mdi:door"></ha-icon>
      {{ 'Open' if is_state('binary_sensor.front_door', 'on') else 'Closed' }}
    </span>

# =============================================================================
# WEATHER EXAMPLES
# =============================================================================

# Full Weather Card
weather_card:
  type: custom:tailwindcss-template-card
  entities:
    - weather.home
  layout_options:
    grid_columns: 6
    grid_rows: 3
  content: |
    <div class="p-6 bg-gradient-to-br from-sky-400 via-blue-500 to-indigo-600 rounded-2xl text-white h-full">
      <div class="flex items-start justify-between">
        <div>
          <p class="text-lg opacity-80">{{ state_attr('weather.home', 'friendly_name') }}</p>
          <p class="text-6xl font-light mt-2">
            {{ state_attr('weather.home', 'temperature') }}°
          </p>
          <p class="text-xl opacity-90 mt-1">{{ states('weather.home') | title }}</p>
        </div>
        <ha-icon 
          icon="mdi:weather-{{ states('weather.home') }}" 
          class="text-7xl opacity-80">
        </ha-icon>
      </div>
      <div class="mt-6 grid grid-cols-3 gap-4 text-center text-sm">
        <div class="bg-white/20 rounded-lg p-3">
          <ha-icon icon="mdi:water-percent" class="text-lg"></ha-icon>
          <p class="mt-1">{{ state_attr('weather.home', 'humidity') }}%</p>
          <p class="text-xs opacity-70">Humidity</p>
        </div>
        <div class="bg-white/20 rounded-lg p-3">
          <ha-icon icon="mdi:weather-windy" class="text-lg"></ha-icon>
          <p class="mt-1">{{ state_attr('weather.home', 'wind_speed') }} km/h</p>
          <p class="text-xs opacity-70">Wind</p>
        </div>
        <div class="bg-white/20 rounded-lg p-3">
          <ha-icon icon="mdi:gauge" class="text-lg"></ha-icon>
          <p class="mt-1">{{ state_attr('weather.home', 'pressure') }} hPa</p>
          <p class="text-xs opacity-70">Pressure</p>
        </div>
      </div>
    </div>

# Compact Weather Badge
weather_badge:
  type: custom:tailwindcss-template-badge
  entity: weather.home
  content: |
    <span class="flex items-center gap-2 px-2">
      <ha-icon icon="mdi:weather-{{ states('weather.home') }}" class="text-blue-500"></ha-icon>
      <span class="font-semibold">{{ state_attr('weather.home', 'temperature') }}°</span>
      <span class="text-gray-500 text-sm">{{ states('weather.home') }}</span>
    </span>
  tap_action:
    action: more-info

# =============================================================================
# LIGHT CONTROL EXAMPLES
# =============================================================================

# Single Light Card with Controls
light_control:
  type: custom:tailwindcss-template-card
  entity: light.living_room
  content: |
    <div class="p-4 rounded-xl transition-all duration-300
      {% if is_state('light.living_room', 'on') %}
        bg-amber-100 dark:bg-amber-900/30
      {% else %}
        bg-gray-100 dark:bg-gray-800
      {% endif %}">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="p-3 rounded-full
            {% if is_state('light.living_room', 'on') %}
              bg-amber-200 text-amber-600
            {% else %}
              bg-gray-200 dark:bg-gray-700 text-gray-500
            {% endif %}">
            <ha-icon icon="mdi:lightbulb{% if is_state('light.living_room', 'off') %}-outline{% endif %}"></ha-icon>
          </div>
          <div>
            <p class="font-medium text-gray-900 dark:text-white">Living Room</p>
            <p class="text-sm text-gray-500">
              {% if is_state('light.living_room', 'on') %}
                {{ state_attr('light.living_room', 'brightness') | int / 255 * 100 | round }}% brightness
              {% else %}
                Off
              {% endif %}
            </p>
          </div>
        </div>
        <div 
          data-ha-action="tap" 
          data-entity="light.living_room"
          class="w-12 h-7 rounded-full cursor-pointer transition-colors
            {% if is_state('light.living_room', 'on') %}
              bg-amber-500
            {% else %}
              bg-gray-300 dark:bg-gray-600
            {% endif %}">
          <div class="w-5 h-5 rounded-full bg-white shadow-md transform transition-transform mt-1
            {% if is_state('light.living_room', 'on') %}
              translate-x-6
            {% else %}
              translate-x-1
            {% endif %}">
          </div>
        </div>
      </div>
    </div>
  tap_action:
    action: toggle
  hold_action:
    action: more-info

# Multi-Room Light Grid
light_grid:
  type: custom:tailwindcss-template-card
  entities:
    - light.living_room
    - light.bedroom
    - light.kitchen
    - light.bathroom
  layout_options:
    grid_columns: 6
    grid_rows: 2
  content: |
    <div class="grid grid-cols-4 gap-2 p-2 h-full">
      {% for light in ['light.living_room', 'light.bedroom', 'light.kitchen', 'light.bathroom'] %}
      <div 
        data-ha-action="tap" 
        data-entity="{{ light }}"
        class="flex flex-col items-center justify-center p-3 rounded-xl cursor-pointer transition-all
          {% if is_state(light, 'on') %}
            bg-yellow-100 hover:bg-yellow-200 dark:bg-yellow-900/30
          {% else %}
            bg-gray-100 hover:bg-gray-200 dark:bg-gray-800
          {% endif %}">
        <ha-icon 
          icon="mdi:lightbulb{% if is_state(light, 'off') %}-outline{% endif %}"
          class="text-2xl mb-2
            {% if is_state(light, 'on') %}
              text-yellow-500
            {% else %}
              text-gray-400
            {% endif %}">
        </ha-icon>
        <p class="text-xs font-medium text-center truncate w-full text-gray-700 dark:text-gray-300">
          {{ state_attr(light, 'friendly_name') | replace(' Light', '') }}
        </p>
      </div>
      {% endfor %}
    </div>

# =============================================================================
# CLIMATE/THERMOSTAT EXAMPLES
# =============================================================================

# Thermostat Card
thermostat:
  type: custom:tailwindcss-template-card
  entity: climate.living_room
  layout_options:
    grid_columns: 4
    grid_rows: 3
  content: |
    <div class="p-4 bg-white dark:bg-slate-800 rounded-2xl h-full flex flex-col">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-gray-800 dark:text-white">
          {{ state_attr('climate.living_room', 'friendly_name') }}
        </h3>
        <span class="px-3 py-1 text-xs font-medium rounded-full
          {% if is_state('climate.living_room', 'heat') %}
            bg-orange-100 text-orange-600 dark:bg-orange-900/30 dark:text-orange-400
          {% elif is_state('climate.living_room', 'cool') %}
            bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400
          {% elif is_state('climate.living_room', 'heat_cool') %}
            bg-purple-100 text-purple-600 dark:bg-purple-900/30 dark:text-purple-400
          {% else %}
            bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400
          {% endif %}">
          {{ states('climate.living_room') | title }}
        </span>
      </div>
      
      <div class="flex-1 flex flex-col items-center justify-center">
        <div class="relative">
          <div class="text-6xl font-light text-gray-900 dark:text-white">
            {{ state_attr('climate.living_room', 'current_temperature') | round }}°
          </div>
          <div class="text-sm text-gray-500 text-center mt-2">
            Target: {{ state_attr('climate.living_room', 'temperature') }}°
          </div>
        </div>
      </div>
      
      <div class="flex justify-center gap-4 mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
        <div class="text-center">
          <ha-icon icon="mdi:water-percent" class="text-blue-500"></ha-icon>
          <p class="text-sm text-gray-600 dark:text-gray-400">
            {{ state_attr('climate.living_room', 'current_humidity') | default('--') }}%
          </p>
        </div>
        <div class="text-center">
          <ha-icon icon="mdi:fan" class="text-gray-500"></ha-icon>
          <p class="text-sm text-gray-600 dark:text-gray-400">
            {{ state_attr('climate.living_room', 'fan_mode') | default('auto') | title }}
          </p>
        </div>
      </div>
    </div>
  tap_action:
    action: more-info

# =============================================================================
# CAMERA EXAMPLES
# =============================================================================

# Camera with WebRTC
camera_webrtc:
  type: custom:tailwindcss-template-card
  entity: camera.front_door
  camera:
    prefer_webrtc: true
    fallback_hls: true
    show_controls: true
  layout_options:
    grid_columns: 6
    grid_rows: 4
  content: |
    <div class="relative h-full overflow-hidden rounded-xl bg-black">
      <div id="camera-stream" class="w-full h-full object-cover"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent pointer-events-none"></div>
      <div class="absolute bottom-0 left-0 right-0 p-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-white font-medium">Front Door</p>
            <p class="text-white/70 text-sm flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-green-500"></span>
              {{ states('camera.front_door') | title }}
            </p>
          </div>
          <div class="flex gap-2">
            <button data-ha-action="tap" class="p-2 bg-white/20 rounded-full hover:bg-white/30">
              <ha-icon icon="mdi:microphone" class="text-white"></ha-icon>
            </button>
            <button data-ha-action="hold" class="p-2 bg-white/20 rounded-full hover:bg-white/30">
              <ha-icon icon="mdi:fullscreen" class="text-white"></ha-icon>
            </button>
          </div>
        </div>
      </div>
    </div>
  tap_action:
    action: more-info
  hold_action:
    action: call-service
    service: camera.snapshot
    data:
      entity_id: camera.front_door
      filename: /config/www/snapshots/front_door.jpg

# =============================================================================
# SENSOR EXAMPLES
# =============================================================================

# Energy Meter Card
energy_meter:
  type: custom:tailwindcss-template-card
  entities:
    - sensor.power_consumption
    - sensor.daily_energy
  content: |
    <div class="p-4 bg-gradient-to-br from-green-500 to-emerald-600 rounded-xl text-white">
      <div class="flex items-center gap-2 mb-3">
        <ha-icon icon="mdi:flash" class="text-2xl"></ha-icon>
        <span class="font-medium">Energy Monitor</span>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <p class="text-3xl font-bold">{{ states('sensor.power_consumption') }}</p>
          <p class="text-sm opacity-80">W current</p>
        </div>
        <div>
          <p class="text-3xl font-bold">{{ states('sensor.daily_energy') }}</p>
          <p class="text-sm opacity-80">kWh today</p>
        </div>
      </div>
    </div>

# Multi-Sensor Status Card
sensor_status:
  type: custom:tailwindcss-template-card
  entities:
    - sensor.temperature
    - sensor.humidity
    - sensor.co2
    - sensor.pm25
  layout_options:
    grid_columns: 6
    grid_rows: 2
  content: |
    <div class="grid grid-cols-4 gap-4 p-4 h-full">
      {% set sensors = [
        {'entity': 'sensor.temperature', 'icon': 'mdi:thermometer', 'name': 'Temp', 'unit': '°C', 'color': 'red'},
        {'entity': 'sensor.humidity', 'icon': 'mdi:water-percent', 'name': 'Humidity', 'unit': '%', 'color': 'blue'},
        {'entity': 'sensor.co2', 'icon': 'mdi:molecule-co2', 'name': 'CO₂', 'unit': 'ppm', 'color': 'green'},
        {'entity': 'sensor.pm25', 'icon': 'mdi:blur', 'name': 'PM2.5', 'unit': 'µg/m³', 'color': 'purple'}
      ] %}
      {% for sensor in sensors %}
      <div class="flex flex-col items-center justify-center bg-gray-50 dark:bg-gray-800 rounded-xl p-3">
        <ha-icon icon="{{ sensor.icon }}" class="text-2xl text-{{ sensor.color }}-500 mb-2"></ha-icon>
        <p class="text-2xl font-bold text-gray-900 dark:text-white">
          {{ states(sensor.entity) }}
        </p>
        <p class="text-xs text-gray-500">{{ sensor.name }}</p>
      </div>
      {% endfor %}
    </div>

# =============================================================================
# SECURITY/ALARM EXAMPLES
# =============================================================================

# Alarm Panel
alarm_panel:
  type: custom:tailwindcss-template-card
  entity: alarm_control_panel.home
  content: |
    <div class="p-4 rounded-xl
      {% if is_state('alarm_control_panel.home', 'armed_away') %}
        bg-red-100 dark:bg-red-900/30
      {% elif is_state('alarm_control_panel.home', 'armed_home') %}
        bg-yellow-100 dark:bg-yellow-900/30
      {% elif is_state('alarm_control_panel.home', 'triggered') %}
        bg-red-500 animate-pulse
      {% else %}
        bg-green-100 dark:bg-green-900/30
      {% endif %}">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <ha-icon 
            icon="mdi:shield{% if is_state('alarm_control_panel.home', 'disarmed') %}-off{% elif is_state('alarm_control_panel.home', 'triggered') %}-alert{% else %}-lock{% endif %}"
            class="text-3xl
              {% if is_state('alarm_control_panel.home', 'triggered') %}
                text-white
              {% elif is_state('alarm_control_panel.home', 'armed_away') %}
                text-red-600
              {% elif is_state('alarm_control_panel.home', 'armed_home') %}
                text-yellow-600
              {% else %}
                text-green-600
              {% endif %}">
          </ha-icon>
          <div>
            <p class="font-semibold text-gray-900 dark:text-white
              {% if is_state('alarm_control_panel.home', 'triggered') %}text-white{% endif %}">
              Home Alarm
            </p>
            <p class="text-sm
              {% if is_state('alarm_control_panel.home', 'triggered') %}
                text-white/80
              {% else %}
                text-gray-500
              {% endif %}">
              {{ states('alarm_control_panel.home') | replace('_', ' ') | title }}
            </p>
          </div>
        </div>
      </div>
    </div>
  tap_action:
    action: more-info

# =============================================================================
# ACTION EXAMPLES
# =============================================================================

# Button Grid with Actions
action_buttons:
  type: custom:tailwindcss-template-card
  content: |
    <div class="grid grid-cols-3 gap-2 p-2">
      <button 
        data-ha-action="tap" 
        data-entity="scene.movie_night"
        class="p-4 bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl transition-colors">
        <ha-icon icon="mdi:movie" class="text-2xl mb-2"></ha-icon>
        <p class="text-sm font-medium">Movie Night</p>
      </button>
      <button 
        data-ha-action="tap" 
        data-entity="scene.dinner"
        class="p-4 bg-amber-500 hover:bg-amber-600 text-white rounded-xl transition-colors">
        <ha-icon icon="mdi:silverware-fork-knife" class="text-2xl mb-2"></ha-icon>
        <p class="text-sm font-medium">Dinner</p>
      </button>
      <button 
        data-ha-action="tap" 
        data-entity="scene.goodnight"
        class="p-4 bg-slate-700 hover:bg-slate-800 text-white rounded-xl transition-colors">
        <ha-icon icon="mdi:weather-night" class="text-2xl mb-2"></ha-icon>
        <p class="text-sm font-medium">Goodnight</p>
      </button>
    </div>
  tap_action:
    action: call-service
    service: scene.turn_on

# =============================================================================
# BADGE EXAMPLES
# =============================================================================

# Status Badge with Color
status_badge:
  type: custom:tailwindcss-template-badge
  entity: binary_sensor.motion_sensor
  content: |
    <span class="flex items-center gap-2">
      <span class="relative flex h-3 w-3">
        {% if is_state('binary_sensor.motion_sensor', 'on') %}
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
        {% else %}
          <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
        {% endif %}
      </span>
      <span class="font-medium">Motion</span>
    </span>
  tap_action:
    action: more-info

# Counter Badge
counter_badge:
  type: custom:tailwindcss-template-badge
  entity: sensor.open_windows
  content: |
    <span class="flex items-center gap-1">
      <ha-icon icon="mdi:window-open-variant" class="text-blue-500"></ha-icon>
      <span class="font-bold">{{ states('sensor.open_windows') }}</span>
      <span class="text-gray-500 text-sm">windows</span>
    </span>
